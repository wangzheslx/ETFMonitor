name: Release

# 打个 v 开头的 tag 推上去即自动打包并发布 Release：
#   Windows x64 / Windows ARM64 / macOS Apple Silicon
# macOS 同时产出 .dmg（标准安装包）和 .zip（解压即用）两种格式。
# 注意：PyInstaller 不能交叉编译，每种架构用对应架构的 runner 各跑一次。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest      # x64 (Intel/AMD)
            artifact: ETFMonitor-Windows-x64.exe
          - os: windows-11-arm      # ARM64 (Surface/骁龙本)
            artifact: ETFMonitor-Windows-ARM64.exe
          # macOS（仅 Apple Silicon；Intel Mac 不再单独打包）
          - os: macos-latest        # Apple Silicon arm64 (M1/M2/M3...)
            artifact: ETFMonitor-macOS-AppleSilicon
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --clean --noconfirm ETFMonitor.spec
          mkdir -p out
          mv dist/ETFMonitor.exe "out/${{ matrix.artifact }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --clean --noconfirm ETFMonitor_mac.spec
          codesign --force --deep --sign - dist/ETFMonitor.app
          mkdir -p out
          base="${{ matrix.artifact }}"
          # 标准安装包 dmg（双击挂载，拖拽到 Applications）
          hdiutil create -volname "ETFMonitor" \
            -srcfolder dist/ETFMonitor.app \
            -ov -format UDZO "out/${base}.dmg"
          # 同时提供 zip（解压即用）
          ditto -c -k --keepParent dist/ETFMonitor.app "out/${base}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: out/*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
