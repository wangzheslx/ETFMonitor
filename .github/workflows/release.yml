name: Release

# 打个 v 开头的 tag 推上去即自动在 4 个平台打包并发布 Release：
#   Windows x64 / Windows ARM64 / macOS Intel / macOS Apple Silicon
# 例如: git tag v1.0.2 && git push origin v1.0.2
# 注意：PyInstaller 不能交叉编译，每种架构用对应架构的 runner 各跑一次。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            artifact: ETFMonitor-Windows-x64.exe
            asset_path: dist/ETFMonitor.exe
          - os: windows-11-arm
            artifact: ETFMonitor-Windows-ARM64.exe
            asset_path: dist/ETFMonitor.exe
          # macOS
          - os: macos-13
            artifact: ETFMonitor-macOS-Intel.zip
            asset_path: dist/ETFMonitor-mac.zip
          - os: macos-latest
            artifact: ETFMonitor-macOS-AppleSilicon.zip
            asset_path: dist/ETFMonitor-mac.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --clean --noconfirm ETFMonitor.spec

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --clean --noconfirm ETFMonitor_mac.spec
          codesign --force --deep --sign - dist/ETFMonitor.app
          cd dist && ditto -c -k --keepParent ETFMonitor.app ETFMonitor-mac.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
